<style>
:root{--bg:#FAFAF8; --surface:#FFFFFF; --fg:#1A1A1B; --muted:#6B6B6E; --panel:#1A1A1B; --panel-fg:#FAFAF8; --track:#E6E6E3; --focus:#2F5F9A; --err:#B5382A; --ok:#2F5F9A; --orange:#6C9BD1; --violet:#2F5F9A; --yellow:#D3E2F3; --teal:#6C9BD1; --ink:#121213; --font:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif; color-scheme:light;}
@media (prefers-color-scheme: dark){:root{--bg:#121213; --surface:#1E1E20; --fg:#F5F5F3; --muted:#A0A0A4; --panel:#232326; --panel-fg:#F5F5F3; --track:#3A3A3C; --focus:#6C9BD1; --err:#FF9A85; --ok:#6C9BD1; --orange:#6C9BD1; --violet:#4A78B3; --yellow:#A9C6E8; --teal:#6C9BD1; --ink:#121213; color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); direction:rtl;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
.app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:20px 24px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.logo{display:flex;align-items:center;gap:8px}
.logo .mark{display:block;flex:none;border-radius:11px;animation:bob 3.2s ease-in-out infinite}
.logo b{font-size:32px;font-weight:900;line-height:1.2}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--fg);background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.sp{width:44px}
.ttl{font-size:20px;font-weight:900}
h1{margin:0;font-size:34px;font-weight:900;line-height:1.3;text-wrap:balance}
p{margin:0}
.sub{font-size:16px;font-weight:500;line-height:1.6;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:15px;font-weight:700}
input[type=text]{height:60px;border:2px solid var(--fg);border-radius:16px;background:var(--surface);color:var(--fg);font-size:20px;font-weight:700;padding:0 16px;outline:none;width:100%}
input.codein{height:84px;border:3px solid var(--violet);border-radius:20px;font-size:44px;font-weight:900;letter-spacing:.3em;text-align:center;padding:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{min-height:60px;border-radius:18px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:900;cursor:pointer;padding:0 18px;width:100%}
.btn.primary{background:var(--orange);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg);min-height:56px;font-size:18px;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--err);font-size:15px;font-weight:700;line-height:1.6}
.label{font-size:18px;font-weight:900}
.games{display:flex;flex-direction:column;gap:10px}
.game{min-height:70px;border-radius:16px;background:var(--surface);padding:10px 14px;display:flex;align-items:center;gap:14px}
.game.soon{opacity:.6}
.num{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--ink)}
.game .t{flex:1;min-width:0;display:flex;flex-direction:column}
.game .t b{font-size:17px;font-weight:700}
.game .t span{font-size:13px;font-weight:500;color:var(--muted)}
.tag{font-size:13px;font-weight:900;border-radius:10px;padding:4px 10px;background:var(--yellow);color:var(--ink);white-space:nowrap}
.tag.off{background:var(--track);color:var(--fg)}
.codecard{border-radius:24px;background:var(--panel);color:var(--panel-fg);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.codecard small{display:block;font-size:14px;font-weight:500;color:var(--yellow)}
.codecard strong{display:block;font-size:54px;font-weight:900;line-height:1.2;letter-spacing:.15em}
.copy{min-height:48px;border-radius:14px;border:none;background:var(--yellow);color:var(--ink);font-size:16px;font-weight:900;padding:0 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cnt{font-size:14px;font-weight:700;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl{min-height:56px;border-radius:16px;background:var(--surface);padding:8px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.pl .n{font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .me{font-size:12px;font-weight:700;color:var(--muted)}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.empty{grid-column:span 2;min-height:56px;border-radius:16px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--muted);text-align:center;padding:0 12px}
.note{font-size:14px;font-weight:500;color:var(--muted);text-align:center;line-height:1.6}
.spacer{flex:1}
.meta{display:flex;align-items:center;justify-content:space-between}
.meta span{font-size:15px;font-weight:700;color:var(--muted)}
.timer{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--orange)}
.qcard{border-radius:24px;background:var(--panel);color:var(--panel-fg);padding:26px 22px;display:flex;flex-direction:column;gap:10px}
.qcard small{font-size:14px;font-weight:700;color:var(--yellow)}
.qcard div{font-size:30px;font-weight:900;line-height:1.4;text-wrap:balance}
.vote{min-height:96px;border-radius:20px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;cursor:pointer;min-width:0}
.vote.sel{border:4px solid var(--violet);padding:6px}
.vote .av{width:40px;height:40px;font-size:20px}
.vote .n{font-size:17px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vote.sel .n{font-weight:900}
.status{min-height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:900;text-align:center;padding:0 14px}
.status.ok{background:var(--violet);color:#FFFFFF}
.status.wait{border:2px dashed var(--muted);color:var(--muted);font-weight:700}
.win{border-radius:28px;background:var(--orange);color:var(--ink);padding:24px 22px;display:flex;flex-direction:column;gap:6px;animation:pop .25s ease-out}
.win .q{font-size:16px;font-weight:700;line-height:1.5}
.win .name{font-size:clamp(44px,17vw,74px);font-weight:900;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.win .name.long{font-size:36px;line-height:1.35}
.badge{align-self:flex-start;min-height:44px;border-radius:22px;background:var(--ink);color:var(--yellow);padding:0 18px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:flex;align-items:center;gap:10px}
.br .n{width:84px;flex:none;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .tr{flex:1;height:28px;border-radius:14px;background:var(--track);overflow:hidden}
.br .f{height:100%;border-radius:14px}
.br .c{width:28px;text-align:left;font-size:20px;font-weight:900}
.rank{display:flex;flex-direction:column;gap:10px}
.rk{min-height:60px;border-radius:16px;background:var(--surface);padding:8px 14px;display:flex;align-items:center;gap:12px}
.rk.first{background:var(--panel);color:var(--panel-fg)}
.rk .pos{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;background:var(--track);color:var(--fg)}
.rk.first .pos{background:var(--yellow);color:var(--ink)}
.rk .n{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk.first .n{font-weight:900}
.rk .v{font-size:18px;font-weight:900}
.rk.first .v{color:var(--yellow)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;max-width:calc(100% - 32px);z-index:20;text-align:center}
.toast[hidden]{display:none}
.locs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.loc{min-height:48px;border-radius:14px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);font-size:16px;font-weight:700;padding:6px 10px;cursor:pointer}
.loc.sel{border:4px solid var(--violet);padding:4px 8px}
.chipx{min-height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:4px 8px;text-align:center}
a.btn{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .loc{padding:6px 16px}
.chips .loc.sel{padding:4px 14px}
.rk .n small{display:block;font-size:12px;font-weight:500;opacity:.8}
.dbg{direction:ltr;font-size:13px;color:var(--muted);word-break:break-all}
html{overscroll-behavior:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active,.vote:active,.loc:active,.copy:active,.iconbtn:active{transform:scale(.97)}
input.codein{direction:ltr}
body{-webkit-font-smoothing:antialiased}

@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--rot));opacity:.9}}
@keyframes shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bigmark{display:flex;justify-content:center}.bigmark .mark{border-radius:30px;animation:bob 3.2s ease-in-out infinite}
.app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.app.enter>*:nth-child(2){animation-delay:.05s}.app.enter>*:nth-child(3){animation-delay:.1s}.app.enter>*:nth-child(4){animation-delay:.15s}.app.enter>*:nth-child(5){animation-delay:.2s}.app.enter>*:nth-child(n+6){animation-delay:.25s}
.app.enter .games>.game{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.app.enter .games>.game:nth-child(2){animation-delay:.2s}.app.enter .games>.game:nth-child(3){animation-delay:.27s}.app.enter .games>.game:nth-child(4){animation-delay:.34s}.app.enter .games>.game:nth-child(5){animation-delay:.41s}
.btn.primary{background-image:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;background-repeat:no-repeat;animation:shine 4.5s ease-in-out infinite}
.btn.primary[disabled]{animation:none}
.vote.sel,.loc.sel{animation:pulse .3s ease-out}
.btn,.vote,.loc,.game{transition:transform .12s ease,background-color .2s,border-color .2s}
.btn:hover,.game:hover{transform:translateY(-1px)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.conf i{position:absolute;top:0;width:10px;height:16px;border-radius:3px;animation:fall var(--d) cubic-bezier(.3,.1,.6,1) var(--l) forwards}
.opt{min-height:64px;border-radius:18px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);font-size:19px;font-weight:700;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;cursor:pointer;width:100%;line-height:1.4}
.opt .k{width:32px;height:32px;flex:none;border-radius:10px;background:var(--track);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.opt .t{flex:1;min-width:0}
.opt.right{background:var(--ok);border-color:var(--ok);color:#06241A;animation:pulse .45s ease-out}
.opt.wrong{background:var(--err);border-color:var(--err);color:#fff;animation:shake .45s ease-out}
.opt.dim{opacity:.5}
.opts{display:flex;flex-direction:column;gap:10px}
.qcard.big div{font-size:26px}
.pts{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:900}
@media (prefers-reduced-motion: reduce){.app.enter>*,.app.enter .games>.game,.logo .mark,.btn.primary,.vote.sel,.opt.right,.opt.wrong{animation:none!important}.conf{display:none}}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.win{animation:none}}
body.rtOn #app{padding-bottom:96px}
#rt{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:560px;margin:0 auto;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#rt[hidden]{display:none}
#rt>*{pointer-events:auto}
.rtbar{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--panel-fg);border-radius:20px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.rtb{position:relative;min-width:58px;height:54px;border-radius:14px;border:0;background:transparent;color:inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer}
.rtb span{font-size:22px;line-height:1.1}.rtb small{font-size:11px;font-weight:700;opacity:.85}
.rtb.on{background:rgba(255,255,255,.14)}.rtb.live{background:var(--orange);color:var(--ink);animation:pulse 1.6s infinite}.rtb.muted{background:var(--err);color:#fff}
.rtn{position:absolute;top:2px;inset-inline-end:6px;background:var(--orange);color:var(--ink);border-radius:10px;font-style:normal;font-size:11px;font-weight:900;min-width:18px;height:18px;line-height:18px;text-align:center}
.rtst{flex:1;text-align:center;font-size:12px;font-weight:700;opacity:.8}
.rtp{background:var(--surface);color:var(--fg);border:2px solid var(--track);border-radius:20px;padding:10px;margin-bottom:8px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.rtg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rts{height:68px;border-radius:14px;border:2px solid var(--track);background:var(--bg);color:var(--fg);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.rts:active{transform:scale(.94);background:var(--yellow);color:var(--ink)}.rts span{font-size:26px;line-height:1.1}.rts small{font-size:12px;font-weight:800}
.rtc{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 2px 8px}
.rtm{align-self:flex-start;background:var(--bg);border-radius:14px;padding:6px 12px;max-width:85%;font-size:15px;line-height:1.5;word-break:break-word}
.rtm.me{align-self:flex-end;background:var(--orange);color:var(--ink)}
.rtm b{display:block;font-size:11px;opacity:.7}.rte{text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.rtf{display:flex;gap:8px}.rtf input{flex:1;min-width:0;height:48px;border-radius:14px;border:2px solid var(--track);background:var(--bg);color:var(--fg);font-family:inherit;font-size:16px;padding:0 12px}
.rtsend{width:52px;height:48px;border-radius:14px;border:0;background:var(--panel);color:var(--panel-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rtbub{background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;margin:0 auto 8px;width:max-content;max-width:100%}
.rtbub[hidden]{display:none}

function view() {

  if (S.screen === 'join') return vJoin();
  if (S.screen === 'login') return vLogin();
  if (S.screen === 'offSetup') return vOffSetup();
  if (S.screen === 'quizPlay') return vQuiz();
  if (S.screen === 'spyPlay') {
    const p = O.spy.phase;
    if (p === 'pass') return vSpyPass();

    if (p === 'discuss') return vSpyDiscuss();
    if (p === 'vote') return vSpyVote();
    if (p === 'guess') return vSpyGuess();
    return vSpyResult();
  }
  if (S.screen === 'offPlay') {
    if (O.phase === 'pass') return vOffPass();

}

/* ---------- room lifecycle ---------- */
function fail(e) {

  S.err = /PERMISSION_DENIED|permission/i.test(c)
    ? 'مش مسموح بالعملية دي. اتأكد إن قواعد الأمان اتنشرت.'
    : 'حصلت مشكلة في الاتصال. جرّب تاني.';

}
function exit(msg) {

  S.code = ''; S.room = undefined; S.screen = 'home'; S.err = ''; S.busy = false; S.advKey = '';
  wakeSet(false);

}
function enterRoom(code) {
  if (offRoom) offRoom();
  S.code = code; S.screen = 'room'; S.busy = false; S.err = ''; S.advKey = ''; S.room = undefined;
  save(); render();
  wakeSet(true);
  offRoom = onValue(ref(db, 'rooms/' + code), (s) => { S.room = s.val(); onRoom(); }, () => { S.room = null; onRoom(); });
}
function onRoom() {
  if (S.screen !== 'room') return;
  if (S.room === null) { exit('القعدة دي خلصت'); return; }
  if (S.room && !(S.room.players && S.room.players[S.uid])) { exit('اتشلت من القعدة'); return; }
  hostTick(); render();
}
function hostTick() {
  const r = S.room;
  if (!r || r.host !== S.uid || r.phase !== 'vote') return;
  const key = r.g + '-' + r.q, ps = PL();
  const all = votedCount(ps, key) >= ps.length, up = now() >= r.qEnd;
  if ((all || up) && S.advKey !== key) {
    S.advKey = key;
    setTimeout(() => {
      update(ref(db, 'rooms/' + S.code), { phase: 'result' }).catch(() => { S.advKey = ''; });
    }, all && !up ? 700 : 0);
  }
}

async function createRoom() {
  if (!S.online) { S.err = S.online === null ? 'ثواني، لسه بنتصل...' : 'مفيش اتصال بالنت. جرّب اللعب من موبايل واحد.'; render(); return; }
  const n = cleanName(S.name);
  if (!n) { S.err = 'اكتب اسمك الأول'; render(); return; }
  S.name = n; S.busy = true; S.err = ''; render();
  try {
    const oldCode = load().code;
    if (oldCode) {
      const os = await get(ref(db, 'rooms/' + oldCode)).catch(() => null);
      const ov = os && os.val();
      if (ov && ov.host === S.uid) remove(ref(db, 'rooms/' + oldCode)).catch(() => {});
    }
    let made = null;
    for (let i = 0; i < 10 && !made; i++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const s = await get(ref(db, 'rooms/' + c));
      if (s.exists()) continue;
      try {
        await set(ref(db, 'rooms/' + c), {
          host: S.uid, phase: 'lobby', g: 0, q: 0, qEnd: 0, made: Date.now(),
          players: { [S.uid]: { name: n, t: Date.now() } }
        });
        made = c;
      } catch (e) { if (i === 9) throw e; }
    }
    if (!made) throw new Error('no code');
    enterRoom(made);
  } catch (e) { fail(e); }
}

async function joinRoom() {
  if (!S.online) { S.err = S.online === null ? 'ثواني، لسه بنتصل...' : 'مفيش اتصال بالنت. جرّب اللعب من موبايل واحد.'; render(); return; }
  const n = cleanName(S.name);
  const c = digits(S.codeInput).replace(/\D/g, '');
  if (c.length !== 4) { S.err = 'الكود لازم يكون ٤ أرقام'; render(); return; }
  if (!n) { S.err = 'اكتب اسمك الأول'; render(); return; }
  S.name = n; S.busy = true; S.err = ''; render();
  try {
    const s = await get(ref(db, 'rooms/' + c));
    const v = s.val();
    if (!v) { S.busy = false; S.err = 'مفيش قعدة بالكود ده'; render(); return; }
    const mine = v.players && v.players[S.uid];
    if (!mine) {
      if (v.phase !== 'lobby') { S.busy = false; S.err = 'القعدة دي بدأت بالفعل'; render(); return; }
      if (Object.keys(v.players || {}).length >= MAXP) { S.busy = false; S.err = 'القعدة اتملت'; render(); return; }
    }
    await set(ref(db, 'rooms/' + c + '/players/' + S.uid), { name: n, t: mine ? (mine.t || Date.now()) : Date.now() });
    enterRoom(c);
  } catch (e) { fail(e); }
}

function leave() {
  const host = isHost(), code = S.code, uid = S.uid;
  exit();
  if (host) remove(ref(db, 'rooms/' + code)).catch(() => {});
  else remove(ref(db, 'rooms/' + code + '/players/' + uid)).catch(() => {});
}
function shuffleIdx(cat) {
  let idx = QUESTIONS.map((_, i) => i);
  const grp = QGROUPS.find((x) => x.key === cat);
  if (grp) idx = idx.filter((i) => i >= grp.from && i < grp.to);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return idx;
}
function startGame() {
  if (!isHost() || PL().length < 2) return;
  const idx = shuffleIdx();
  S.advKey = '';
  update(ref(db, 'rooms/' + S.code), { phase: 'vote', q: 0, qs: idx.slice(0, NQ), qEnd: now() + DUR }).catch(fail);
}
function nextQ() {
  const r = S.room; if (!isHost() || !r) return;
  S.advKey = '';
  const patch = r.q + 1 < QS().length ? { phase: 'vote', q: r.q + 1, qEnd: now() + DUR } : { phase: 'end' };
  update(ref(db, 'rooms/' + S.code), patch).catch(fail);
}
function again() {
  const r = S.room; if (!isHost() || !r) return;
  S.advKey = '';
  update(ref(db, 'rooms/' + S.code), { phase: 'lobby', g: r.g + 1, q: 0, qEnd: 0, qs: null }).catch(fail);
}
function castVote(id) {
  const r = S.room;

  set(ref(db, 'rooms/' + S.code + '/votes/' + S.uid + '/' + r.g + '-' + r.q), id).catch(fail);
}
function copyCode() {

  const ok = () => toast('اتنسخ الكود واللينك');

  } catch (e) { no(); }
}

  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

function playSfx(k) {

  else if (k === 'no') { tone(ac, t, 300, 120, 0.45, 'sawtooth', 0.3); tone(ac, t + 0.02, 150, 70, 0.45, 'square', 0.15); }
  else if (k === 'yes') { tone(ac, t, 523, 0, 0.14, 'triangle', 0.35); tone(ac, t + 0.14, 784, 0, 0.3, 'triangle', 0.35); }
  else if (k === 'clap') { for (let i = 0; i < 9; i++) noise(ac, t + i * 0.09 + Math.random() * 0.03, 0.07, 0.5); }
  else if (k === 'wow') { tone(ac, t, 200, 900, 0.5, 'sine', 0.35); tone(ac, t + 0.5, 900, 700, 0.3, 'sine', 0.3); }
  else if (k === 'drum') { tone(ac, t, 150, 45, 0.3, 'sine', 0.7); noise(ac, t + 0.3, 0.06, 0.3); tone(ac, t + 0.4, 150, 45, 0.3, 'sine', 0.7); noise(ac, t + 0.4, 0.05, 0.4); }

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'rtform') return; e.preventDefault();
  const i = document.getElementById('rtin'), x = (i.value || '').trim().slice(0, 200); if (!x) return;
  i.value = ''; RT.chat.push({ n: 'أنت', x: x, me: true }); rtSend({ t: 'chat', x: x }); rtUI(); const n = document.getElementById('rtin'); if (n) n.focus();
});
function rtSync() {
  if (S.screen === 'room' && S.room && S.code) {
    if (RT.code && RT.code !== S.code) rtStop();
    if (!RT.peer && !RT.starting) rtStart(); else rtLink();
    if (RT.mic) rtPlayers().forEach((p) => rtMicCall(p.id));
  } else if (RT.peer || RT.code) rtStop();
  rtUI();
}

/* ---------- boot ---------- */
const LINK = (() => { try { const c = new URLSearchParams(location.search).get('room'); return /^\d{4}$/.test(c || '') ? c : ''; } catch (e) { return ''; } })();
S.name = load().name || '';
(function () { const st = load(); if (Array.isArray(st.onames)) O.names = st.onames.slice(0, MAXP).map(cleanName).filter(Boolean); if (['spy', 'likely', 'trivia', 'proverb'].indexOf(st.ogame) >= 0) O.game = st.ogame; if (typeof st.ocat === 'string' && (st.ocat === 'all' || QGROUPS.some((g) => g.key === st.ocat))) O.cat = st.ocat; })();
if (LINK) { S.codeInput = LINK; S.screen = 'join'; }
else if (!cleanName(S.name)) S.screen = 'login';
render();
(async () => {
  try {
    const st = load();
    const base = 'https://www.gstatic.com/firebasejs/11.0.2/';
    const mods = await Promise.race([
      Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))
    ]);
    ({ initializeApp } = mods[0]);
    ({ getAuth, onAuthStateChanged, signInAnonymously } = mods[1]);
    ({ getDatabase, ref, get, set, update, remove, onValue } = mods[2]);
    const app = initializeApp(CFG);
    auth = getAuth(app); db = getDatabase(app);
    await new Promise((res) => { const u = onAuthStateChanged(auth, () => { u(); res(); }); });
    if (!auth.currentUser) await signInAnonymously(auth);
    S.uid = auth.currentUser.uid;
    try { onValue(ref(db, '.info/serverTimeOffset'), (s) => { offset = s.val() || 0; }); } catch (e) {}
    S.online = true; setNet();
    if (st.code && (!LINK || LINK === st.code)) {
      const s = await get(ref(db, 'rooms/' + st.code));
      const v = s.val();
      if (v && v.host === S.uid && v.made && Date.now() - v.made > 6 * 3600 * 1000) {
        remove(ref(db, 'rooms/' + st.code)).catch(() => {}); S.code = ''; save();
      } else if (v && v.players && v.players[S.uid]) { enterRoom(st.code); return; }
      else { S.code = ''; save(); }
    }
    if (LINK && S.screen === 'join' && cleanName(st.name)) { S.name = st.name; S.codeInput = LINK; joinRoom(); }
  } catch (e) {
    S.online = false; S.errCode = (e && (e.code || e.message)) || String(e); setNet();
  }
})();
</script>
